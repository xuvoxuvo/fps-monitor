[package]
name = "fps-monitor"
version = "1.0.0"
edition = "2021"
rust-version = "1.82"
description = "Minimal Windows FPS overlay (PresentMon, no DLLs or drivers)"
license = "MIT"
repository = "https://github.com/xuvoxuvo/fps-monitor"
build = "build.rs"

[[bin]]
name = "fps-monitor"
path = "src/main.rs"

[features]
default = []
# Embed PresentMon inside the exe and
# unpack it into %LOCALAPPDATA%\fps-monitor\runtime at startup. Produces a
# single-file build; the default build keeps it in a `bin\` folder next to
# the exe instead (see README: "PresentMon").
embed-assets = []

[dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_GdiPlus",
    "Win32_System_LibraryLoader",
    "Win32_System_Performance",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
